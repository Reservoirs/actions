name: PrintP Number

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Enter a number"
        required: true
        default: "42"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python
        run: python3 main.py "${{ github.event.inputs.number }}"

      - name: Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add result.txt

          git diff --cached --quiet || git commit -m "Update result"

          git push
