name: Download and Push

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Enter download URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download file
        run: python3 main.py "${{ github.event.inputs.url }}"

      - name: Push downloaded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Download file"

          git push
