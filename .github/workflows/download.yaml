
name: Download Multiple Files

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Enter URLs separated by commas"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h

      - name: Download files
        run: |
          python3 main.py "${{ github.event.inputs.urls }}"

      - name: Read branch name
        id: branch
        run: |
          BRANCH=$(cat branch_name.txt)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH"

      - name: Create branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          BRANCH="${{ steps.branch.outputs.branch }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch already exists: $BRANCH"
            git checkout "$BRANCH"
          else
            echo "Creating branch: $BRANCH"
            git checkout -b "$BRANCH"
          fi

      - name: Commit and push files
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"

          git add .

          git diff --cached --quiet || git commit -m "Add downloaded files"

          git push -u origin "$BRANCH"

