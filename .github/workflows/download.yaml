name: Download Multiple Files

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Enter URLs separated by commas"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h

      - name: Download files
        run: |
          python3 main.py "${{ github.event.inputs.urls }}"

      - name: List downloaded files
        run: |
          ls -lh

      - name: Push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Download files"

          git push
